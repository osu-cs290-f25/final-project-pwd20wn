<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deal Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>

<body>

  <!-- Header Area -->
  <header class="header">
 
  <!-- Left: Logo -->
  <div class="top-left">
    <div class="logo">Deal Finder</div>
  </div>

  <!-- Middle: Filters -->
  <div class="top-middle">
    <input class="search-bar" type="text" placeholder="Search deals...">

    <select class="nav-select">
      <option>Stores</option>
    </select>

    <select class="nav-select">
      <option>Types</option>
    </select>

    <select class="nav-select">
      <option>Deal Rating</option>
    </select>

    <select class="nav-select">
      <option>Price</option>
    </select>
  </div>

  <!-- Right: Watchlist and Light Mode -->
  <div class="top-right">
    <div class="nav-btn">Watchlist</div>
    <button class="light-mode-toggle">💡</button>
  </div>

</header>


  <!-- Deals Area -->
  <main class="deals">
    
  </main>

</body>
</html>
